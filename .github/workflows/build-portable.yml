name: Build portable Windows app

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build portable package
        shell: pwsh
        run: .\packaging\build-portable.ps1
      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: Axis-0.1.0-alpha.1-windows-x64-portable
          path: dist/Axis-0.1.0-alpha.1-windows-x64-portable.zip
